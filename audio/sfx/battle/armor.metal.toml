# A clank of plate or mail: a short ringing metal impact, high-passed, with a jingle of rings.
variants = 5
seed = 815
group = "sweetener"
max_ms = 450

[[layer]]                          # mail and plates shaken by the blow
pick = ["ad_chainmail_1", "ad_chainmail_2", "ad_armor_light"]
length = 300
pitch = [-1.0, 2.0]
filter = [{ type = "highpass", hz = 1800 }]
fade_out = 100

[[layer]]                          # the clank
pick = ["kenney_metal_light_0", "kenney_metal_light_1", "kenney_metal_light_3"]
pitch = [-2.0, 2.0]
filter = [{ type = "highpass", hz = 1500 }]
fade_out = 60
gain = [-6, -2]

[[layer]]                          # a ring on some
source = "ad_metal_ringing"
chance = 0.5
length = 300
pitch = [-3.0, 2.0]
filter = [{ type = "highpass", hz = 2500 }]
fade_out = 160
gain = [-15, -11]

[post]
chain = [
  { type = "compress", threshold_db = -18, ratio = 3, attack_ms = 0.5, release_ms = 50 },
  { type = "trim", threshold_db = -48, keep_tail_ms = 30 },
  { type = "fade_out", ms = 40 },
]
