# Rime on-hit: a crisp ice crackle, high-passed so it rides over the weapon's hit.
variants = 2
seed = 1102
group = "sweetener"
max_ms = 450

[[layer]]                          # ice cracking
pick = ["ig_ice_2", "ig_ice_1", "ig_ice_4", "ig_ice_5"]
length = 280
pitch = [0.0, 3.0]
filter = [{ type = "highpass", hz = 900 }]
fade_out = 110

[[layer]]                          # a glassy glint
pick = ["kenney_glass_light_1", "kenney_glass_light_3"]
pitch = [5.0, 8.0]
filter = [{ type = "highpass", hz = 3000 }]
fade_out = 60
gain = [-10, -7]

[[layer]]                          # crystals snapping
synth = { kind = "crackle", density = [250, 400], click_ms = 0.4, length = 220 }
filter = [{ type = "highpass", hz = 3500 }]
envelope = [[0, 0], [220, -40]]
gain = [-12, -9]

[post]
chain = [
  { type = "compress", threshold_db = -20, ratio = 3, attack_ms = 1, release_ms = 60 },
  { type = "limit", ceiling_db = -10, release_ms = 30 },
  { type = "trim", threshold_db = -48, keep_tail_ms = 30 },
  { type = "fade_out", ms = 40 },
]
