# A wand's or spell's miss: a fizzle, the charge dispersing in a descending crackle.
variants = 3
seed = 1006
group = "impact"
max_ms = 600

[[layer]]                          # a charge dying, real, dulled
source = "up_electric_off"
start = [0, 120]
length = 380
pitch = [-4.0, 0.0]
filter = [{ type = "highpass", hz = 500 }, { type = "lowpass", hz = 4500 }]
fade_in = 10
fade_out = 150
gain = [-17, -13]

[[layer]]                          # crackle thinning out as it falls
synth = { kind = "crackle", density = [700, 1000], click_ms = [0.8, 1.4], length = 380 }
filter = [{ type = "bandpass", hz = [4500, 6000], hz_end = [900, 1300], q = 1.2 }]
envelope = [[0, 0], [60, -2], [380, -42]]

[[layer]]                          # the hiss going out
synth = { kind = "noise", color = "pink", length = 360 }
filter = [{ type = "bandpass", hz = [3500, 5000], hz_end = [700, 1000], q = 1.5 }]
envelope = [[0, -6], [30, 0], [360, -45]]
gain = [-9, -6]

[[layer]]                          # a falling whistle under it
synth = { kind = "sine", hz = [1400, 1900], hz_end = [350, 500], length = 300 }
envelope = [[0, -20], [20, 0], [300, -50]]
gain = [-22, -18]

[post]
chain = [
  { type = "compress", threshold_db = -22, ratio = 3, attack_ms = 2, release_ms = 60 },
  { type = "reverb", impulse = "small_room", wet_db = -20, predelay_ms = 4 },
  { type = "limit", ceiling_db = -10, release_ms = 30 },
  { type = "trim", threshold_db = -50, keep_tail_ms = 40 },
  { type = "fade_out", ms = 40 },
]
