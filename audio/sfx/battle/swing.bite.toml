# A fast hiss into a wet snap of mandibles.
variants = 3
seed = 806
group = "release"
max_ms = 380

[[layer]]                          # the hiss as it lunges
source = "bart_steam_hiss"
length = 160
pitch = [0.0, 3.0]
filter = [{ type = "highpass", hz = 1800 }, { type = "lowpass", hz = 11000 }]
envelope = [[0, -30], [120, 0], [160, -18]]
fade_out = 20
gain = [-8, -5]

[[layer]]                          # the snap of mandibles
pick = ["ad_bite_2", "rd_snap_2", "ad_bite_1"]
length = 160
pitch = [-1.0, 2.0]
filter = [{ type = "highpass", hz = 300 }]
fade_out = 50
offset = [125, 145]

[[layer]]                          # wet on the snap
pick = ["rd_slime_07", "rd_slime_02"]
length = 120
pitch = [-2.0, 1.0]
filter = [{ type = "highpass", hz = 500 }]
fade_out = 50
offset = [130, 150]
gain = [-10, -6]

[post]
chain = [
  { type = "compress", threshold_db = -20, ratio = 3, attack_ms = 1, release_ms = 40 },
  { type = "limit", ceiling_db = -12, release_ms = 30 },
  { type = "trim", threshold_db = -45, keep_tail_ms = 25 },
  { type = "fade_out", ms = 20 },
]
