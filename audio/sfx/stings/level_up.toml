# A bright ascent in G (after the victory sting): Kenney's pizzicato run an octave up, then a bell arpeggio G5 B5 D6 G6 with a shimmer.
variants = 1
seed = 10001
group = "sting"
max_ms = 2700

[[layer]]                          # the climb: Kenney's rising pizzicato (D E F# G), an octave up, so its G lands at ~170 ms
source = "kenney_jingle_pizzi_10"
pitch = 12
filter = [{ type = "highpass", hz = 200 }]
fade_out = 60
gain = -2

[[layer]]                          # bells: G5
synth = { kind = "fm", carrier_hz = 784.0, ratio = 2.0, index = 2.0, index_end = 0.1, length = 1300 }
envelope = [[0, -40], [3, 0], [1300, -45]]
fade_out = 50
gain = -6
offset = 190

[[layer]]                          # B5
synth = { kind = "fm", carrier_hz = 987.8, ratio = 2.0, index = 1.8, index_end = 0.1, length = 1250 }
envelope = [[0, -40], [3, 0], [1250, -45]]
fade_out = 50
gain = -7
offset = 270

[[layer]]                          # D6
synth = { kind = "fm", carrier_hz = 1174.7, ratio = 2.0, index = 1.6, index_end = 0.1, length = 1200 }
envelope = [[0, -40], [3, 0], [1200, -45]]
fade_out = 50
gain = -8
offset = 350

[[layer]]                          # G6
synth = { kind = "fm", carrier_hz = 1568.0, ratio = 2.0, index = 1.4, index_end = 0.1, length = 1250 }
envelope = [[0, -40], [3, 0], [1250, -45]]
fade_out = 50
gain = -7
