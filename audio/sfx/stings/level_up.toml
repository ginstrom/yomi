gain = -22
offset = 430

[post]
chain = [
  { type = "delay", ms = 110, feedback = 0.3, wet_db = -14 },
  { type = "reverb", impulse = "stone_hall", wet_db = -14, predelay_ms = 10 },
  { type = "limit", ceiling_db = -3, release_ms = 60 },
  { type = "trim", threshold_db = -60, keep_tail_ms = 150 },
  { type = "fade_out", ms = 300 },
]
