# A sax pickup (D E F# G, Kenney Music Jingles) landing on a held G major brass chord with timpani; resolves major. Key: G.
variants = 1
seed = 9801
group = "sting"
max_ms = 4500

[[layer]]                          # the pickup: Kenney's rising sax jingle, its G lands at ~420 ms
source = "kenney_jingle_sax_10"
filter = [{ type = "highpass", hz = 120 }]
fade_out = 80
gain = 3

# The brass chord on G (G2 G3 B3 D4 G4): saws whose filter opens and closes like a brass swell, G3 and D4 doubled by a detuned twin.
[[layer]]
synth = { kind = "saw", hz = 98.0, length = 2300 }
filter = [{ type = "lowpass", hz = 900, hz_end = 300 }, { type = "highpass", hz = 50 }]
envelope = [[0, -30], [30, -3], [300, -6], [1700, -10], [2300, -60]]
gain = -9
offset = 420

