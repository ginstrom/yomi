# A parchment stamp, then a soft rising bell chime (G5 to D6) with a short bloom.
variants = 2
seed = 9601
group = "ui"
max_ms = 1050

[[layer]]                          # the stamp
pick = ["kenney_book_close", "kenney_book_place_1"]
start = 20
length = 160
filter = [{ type = "lowpass", hz = 3500 }, { type = "highpass", hz = 90 }]
fade_out = 60
gain = 5

[[layer]]                          # bell one (G5)
synth = { kind = "fm", carrier_hz = [782, 789], ratio = 3.5, index = [1.8, 2.6], index_end = 0.2, length = 650 }
envelope = [[0, -40], [4, 0], [650, -55]]
fade_out = 80
gain = -6
offset = [110, 130]

[[layer]]                          # bell two (D6), a fifth above
synth = { kind = "fm", carrier_hz = [1172, 1180], ratio = 3.5, index = [1.6, 2.4], index_end = 0.2, length = 600 }
envelope = [[0, -40], [4, 0], [600, -55]]
fade_out = 80
gain = -5
offset = [250, 280]

[post]
chain = [
  { type = "reverb", impulse = "small_room", wet_db = -16 },
  { type = "trim", threshold_db = -55, keep_tail_ms = 40 },
  { type = "fade_out", ms = 120 },
]
