# Sighted: monsters seen in the distance: a far-off war horn on A answering two low drum hits, damped and open-air, from the same war drum as the confront.
variants = 2
seed = 13200
group = "world"
max_ms = 1800

[[layer]]                          # first drum hit
source = "fs_taiko"
length = 500
pitch = [-6.0, -4.5]
filter = [{ type = "highpass", hz = 45 }, { type = "lowpass", hz = 1400 }]
fade_out = 200
gain = [2, 3]

[[layer]]                          # second drum hit, a little softer
pick = ["fs_war_drum", "fs_taiko"]
length = 550
pitch = [-6.0, -4.5]
filter = [{ type = "highpass", hz = 45 }, { type = "lowpass", hz = 1400 }]
fade_out = 250
offset = [250, 340]
gain = [0, 1]

[[layer]]                          # the far horn
source = "fs_distant_horn"
start = [0, 450]
length = 1150
pitch = [-1.0, 0.0]
filter = [{ type = "highpass", hz = 180 }, { type = "lowpass", hz = [1500, 2000] }]
fade_in = 180
fade_out = 350
offset = [120, 220]
gain = [-9, -7]

[post]
chain = [
  { type = "compress", threshold_db = -18, ratio = 2, attack_ms = 5, release_ms = 150 },
  { type = "reverb", impulse = "open_air", wet_db = -9, predelay_ms = 35 },
  { type = "limit", ceiling_db = -8, release_ms = 100 },
  { type = "trim", threshold_db = -45, keep_tail_ms = 100 },
  { type = "fade_out", ms = 250 },
]
