# A facility built or raised: hammering on timber, a saw's stroke, a last knock, then a rising chime (G5, B5, D6).
variants = 2
seed = 13900
group = "world"
max_ms = 2250

[[layer]]                          # hammer
pick = ["rd_wood_hammer_1", "rd_wood_hammer_2"]
pitch = [-1.5, 0.5]
filter = [{ type = "highpass", hz = 90 }, { type = "lowpass", hz = 6000 }]
fade_out = 60

[[layer]]                          # hammer again
pick = ["rd_wood_hammer_2", "rd_wood_hammer_1"]
pitch = [-1.5, 0.5]
filter = [{ type = "highpass", hz = 90 }, { type = "lowpass", hz = 6000 }]
