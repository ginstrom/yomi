  { type = "compress", threshold_db = -18, ratio = 2.5, attack_ms = 3, release_ms = 100 },
  { type = "reverb", impulse = "small_room", wet_db = -16, predelay_ms = 8 },
  { type = "limit", ceiling_db = -11, release_ms = 60 },
  { type = "trim", threshold_db = -45, keep_tail_ms = 80 },
  { type = "fade_out", ms = 200 },
]
