# The Builders' Lodge: a timber builders' shed with a drawing bench in its
# open bay, a stack of logs on its west side and sawn planks on its east, all
# on the encampment's stone footing. Each level adds to it, as the encampment
# screen shows the frame of the Lodge's level: a timber crane with a dressed
# stone on its hook and two cut blocks at the door at level 2, and at level 3
# stone corner posts, a stone chimney, a mason's compass in gold on the roof,
# a milestone and a paved stretch of road.
