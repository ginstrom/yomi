# The trading post: a merchant's stall under a striped awning, wares hung on
# its back wall and laid on its counter. Each level adds to it, as the
# encampment screen shows the frame of the post's level: crates and a barrel
# at level 2, a gilded sign over the awning at level 3, and at level 4, the
# market that sells steel, a blue banner on a pole and a rack of steel blades.
