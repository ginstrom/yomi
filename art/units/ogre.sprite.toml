# A breath: the shoulders and club rise and sink a pixel; the feet stay put.
[frames.idle_1]
from = "idle_0"
move = { rows = [0, 26], by = [0, 1] }

[anim.idle]
frames = ["idle_0", "idle_1"]
ms = 640

# A stride: the legs part and nothing above them moves.
[frames.walk_0]
from = "idle_0"
[frames.walk_0.runs]
26 = [[9, "SssSS"], [16, "sssSS"]]
27 = [[8, "SssSS"], [17, "sssSS"]]
28 = [[7, "SssSS"], [18, "sssSS"]]
29 = [[11, "..."], [6, "SssSS"], [16, "....."], [18, "ssssSS"]]
30 = [[5, "SsssssSS"], [13, "......"], [16, "..."], [19, "sssssSS"]]

# The near foot lifts: the left, then the right. Only the leg rows change.
[frames.walk_1]
from = "idle_0"
[frames.walk_1.runs]
28 = [[9, "SssSS"]]
29 = [[8, "......"]]
30 = [[7, "........"]]

[frames.walk_2]
from = "idle_0"
[frames.walk_2.runs]
28 = [[16, "sssSS"]]
29 = [[16, "......"]]
30 = [[16, "......."]]

[anim.walk]
frames = ["walk_0", "walk_1", "walk_0", "walk_2"]
ms = 170
