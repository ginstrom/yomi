# The Blight Horror, which guards the Source: a hunched hulk of rotten olive
# flesh, bone spikes down its back, one pale eye, a red maw of teeth and a
# long claw reaching forward.
canvas = "unit"
outline = "auto"

[frames.idle_0.runs]
6 = [[10, "W"], [15, "W"], [20, "W"]]
7 = [[10, "W"], [15, "W"], [20, "W"]]
8 = [[9, "GggggggggggggG"]]
9 = [[8, "GggeegggggeegggG"]]
10 = [[7, "GggggggeggggggggeG"]]
11 = [[6, "GgggegggggggggggGeeee"]]
12 = [[5, "GgggggggegggggggggGeYee"]]
13 = [[5, "GggegggggggggegggGgeeee"]]
14 = [[5, "Ggggggggggeggggggggrrrr"]]
15 = [[5, "GgggegggggggggggggRWRWR"]]
16 = [[5, "GggggggggeggggggggRRRRR"]]
17 = [[5, "GGgggggggggggegggGWRWR"]]
18 = [[6, "GGggggggggggggggeee"]]
19 = [[6, "GGgggggegggggggeeee"]]
20 = [[7, "GGgggggggggggGgeee"]]
21 = [[7, "GGgggggggggg"], [20, "Ggee"]]
22 = [[8, "GGgggggggg"], [20, "WgWgW"]]
23 = [[9, "Ggg"], [14, "Ggg"], [20, "W"], [22, "W"], [24, "W"]]
24 = [[9, "Ggg"], [14, "Ggg"]]
25 = [[9, "Ggg"], [14, "Ggg"]]
26 = [[8, "Gggg"], [14, "Gggg"]]
27 = [[8, "Gggg"], [14, "Gggg"]]
28 = [[8, "Gggg"], [14, "Gggg"]]
29 = [[7, "Ggggg"], [13, "Gggggg"]]
30 = [[7, "WgWgW"], [13, "WgWgWg"]]

# A breath: the hulk sinks a pixel over its legs, claw and all.
[frames.idle_1]
from = "idle_0"
move = { rows = [0, 22], by = [0, 1] }

# A stride: the legs part and nothing above them moves.
[frames.walk_0]
from = "idle_0"
[frames.walk_0.runs]
24 = [[4, "....Ggg....Ggg......"]]
25 = [[4, "....Ggg....Ggg......"]]
26 = [[4, "...Gggg.....Ggg....."]]
27 = [[4, "..Gggg......Gggg...."]]
28 = [[4, "..Gggg.......Gggg..."]]
29 = [[4, ".Ggggg.......Ggggg.."]]
30 = [[4, ".WgWgW.......WgWgW.."]]

[anim.idle]
frames = ["idle_0", "idle_1"]
ms = 600

# The near foot lifts: the left, then the right. Only the leg rows change.
[frames.walk_1]
from = "idle_0"
[frames.walk_1.rows]
27 = "......kGggggkkGgggk............."
28 = "......kWgWgWkkGgggk............."
29 = ".......kkkkkkGgggggk............"
30 = "............kWgWgWgk............"
31 = ".............kkkkkk............."

[frames.walk_2]
from = "idle_0"
[frames.walk_2.rows]
27 = ".......kGgggkGgggggk............"
28 = ".......kGgggkWgWgWgk............"
29 = "......kGggggkkkkkkk............."
30 = "......kWgWgWk..................."
31 = ".......kkkkk...................."

[anim.walk]
frames = ["walk_0", "walk_1", "walk_0", "walk_2"]
ms = 160
