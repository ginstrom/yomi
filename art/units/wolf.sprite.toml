# A wolf: a low, lean grey skirmisher, head forward, tail streaming behind,
# pale muzzle and a gold eye; built to run down the archer.
canvas = "unit"

outline = "auto"

[points]
chest = [17, 23]

[frames.idle_0.runs]
19 = [[6, "d"], [25, "D"], [28, "D"]]
20 = [[6, "dl"], [25, "Dd"], [28, "dD"]]
21 = [[7, "dl"], [24, "dllllld"]]
22 = [[8, "ddllllllllllllll"], [24, "dlYllld"]]
23 = [[7, "ddlllllllllllllll"], [24, "ddlwwwD"]]
24 = [[7, "ddddddddddddddddd"], [24, "dddWWWD"]]
25 = [[8, "DdddddddddddddddD"], [25, "dWWD"]]
26 = [[9, "DDDDDDDDDDDDDDD"]]
27 = [[9, "ddd"], [13, "DD"], [18, "ddd"], [22, "DD"]]
28 = [[9, "ddd"], [13, "DD"], [18, "ddd"], [22, "DD"]]
29 = [[9, "ddd"], [13, "DD"], [18, "ddd"], [22, "DD"]]
30 = [[8, "dddd"], [13, "DDD"], [18, "dddd"], [22, "DDD"]]

# A breath: the whole body sinks a pixel above the paws.
[frames.idle_1]
from = "idle_0"
move = { rows = [0, 26], by = [0, 1] }

[anim.idle]
frames = ["idle_0", "idle_1"]
ms = 520

# A lope: the near legs reach apart (back leg behind, front leg ahead) and
# the far legs slant the other way.
[frames.walk_0]
from = "idle_0"
[frames.walk_0.runs]
28 = [[9, "..."], [13, ".."], [18, "..."], [22, ".."], [14, "DD"], [21, "DD"], [8, "ddd"], [19, "ddd"]]
29 = [[9, "..."], [13, ".."], [18, "..."], [22, ".."], [15, "DD"], [21, "DD"], [7, "ddd"], [20, "dd"]]
30 = [[8, "...."], [13, "..."], [18, "...."], [22, "..."], [15, "DDD"], [20, "DDD"], [6, "dddd"], [21, "dddd"]]

# The near paws lift, then the far ones.
[frames.walk_1]
from = "idle_0"
[frames.walk_1.runs]
29 = [[9, "..."], [18, "..."]]
30 = [[8, "...."], [18, "...."]]

[frames.walk_2]
from = "idle_0"
[frames.walk_2.runs]
29 = [[13, ".."], [22, ".."]]
30 = [[13, "..."], [22, "..."]]

[anim.walk]
frames = ["walk_0", "walk_1", "walk_0", "walk_2"]
ms = 110
