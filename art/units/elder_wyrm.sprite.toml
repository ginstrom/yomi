# on four thick angled legs, its thick neck lifted and its great horned head
# thrust forward with ember in the open jaws, a tall rust wing folded up over the
# back with ivory fingertips, ivory spines along the neck, tan belly plates, and
# a heavy spiked tail dragging on the left.
