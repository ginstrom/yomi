# A giant spider: a dark brown body, a bulging abdomen with a venom-green mark,
# red eyes and pale fangs, on long legs whose knees rise above its back.
canvas = "unit"

outline = "auto"

[points]
chest = [18, 20]

[frames.idle_0.runs]
8 = [[9, "T"]]
9 = [[8, "t"], [10, "t"]]
10 = [[7, "t"], [11, "t"]]
11 = [[6, "t"], [12, "t"], [27, "T"]]
12 = [[5, "t"], [13, "t"], [26, "t"], [28, "t"]]
13 = [[4, "t"], [14, "t"], [25, "t"], [28, "t"]]
14 = [[3, "t"], [6, "nnnnnn"], [14, "t"], [24, "t"], [29, "t"]]
15 = [[2, "t"], [4, "Nnnnnnnnnn"], [15, "t"], [23, "t"], [29, "t"]]
16 = [[1, "t"], [3, "NNnnneennnNN"], [15, "t"], [22, "t"], [29, "t"]]
17 = [[1, "t"], [3, "NNNneeeenNNN"], [16, "nnnnn"], [21, "t"], [29, "t"]]
18 = [[1, "t"], [3, "NNNNneenNNNN"], [15, "Nnnnnnnnn"], [29, "t"]]
19 = [[1, "t"], [3, "NNNNeeeeNNNN"], [15, "NNnnnnNror"], [29, "t"]]
20 = [[1, "t"], [3, "NNNNNeeNNNNN"], [15, "NNNNNNNNNNN"], [30, "t"]]
21 = [[1, "t"], [3, "NNNNNNNNNNNN"], [15, "NNNNNNNNNNN"], [30, "t"]]
22 = [[1, "t"], [4, "NNNNNNNNNN"], [16, "NNNNNNNNNn"], [30, "t"]]
23 = [[1, "t"], [3, "n"], [5, "NNNNNNNNn"], [16, "tn"], [19, "t"], [23, "WW"], [26, "n"], [30, "t"]]
24 = [[1, "t"], [3, "n"], [7, "NNNN"], [12, "n"], [15, "t"], [18, "n"], [20, "t"], [24, "W"], [26, "n"], [30, "t"]]
25 = [[1, "t"], [4, "n"], [11, "n"], [14, "t"], [19, "n"], [21, "t"], [27, "n"], [30, "t"]]
26 = [[1, "t"], [4, "n"], [10, "n"], [13, "T"], [20, "n"], [22, "T"], [27, "n"], [30, "t"]]
27 = [[1, "t"], [4, "n"], [10, "n"], [13, "t"], [20, "n"], [22, "t"], [27, "n"], [30, "t"]]
28 = [[1, "t"], [4, "n"], [9, "n"], [12, "t"], [21, "n"], [23, "t"], [27, "n"], [30, "t"]]
29 = [[1, "t"], [5, "n"], [9, "n"], [12, "t"], [21, "n"], [23, "t"], [27, "n"], [30, "t"]]
30 = [[1, "T"], [5, "n"], [8, "n"], [11, "T"], [22, "n"], [24, "T"], [27, "n"], [30, "T"]]

# A breath: the body sinks a pixel and the knees bend; the feet stay put.
[frames.idle_1]
from = "idle_0"
move = { rows = [0, 26], by = [0, 1] }

[anim.idle]
frames = ["idle_0", "idle_1"]
ms = 600

# A stride: the legs as they stand.
[frames.walk_0]
from = "idle_0"

# One set of four legs lifts (near back and front-low, far back-low and front),
# then the other. Only the foot rows change.
[frames.walk_1]
from = "idle_0"
[frames.walk_1.runs]
28 = [[2, "T"], [10, "n"], [24, "T"], [28, "n"]]
29 = [[1, "."], [9, "."], [23, "."], [27, "."]]
30 = [[1, "."], [8, "."], [24, "."], [27, "."]]

[frames.walk_2]
from = "idle_0"
[frames.walk_2.runs]
28 = [[5, "n"], [13, "T"], [29, "T"]]
29 = [[5, "."], [12, "."], [21, "."], [30, "."]]
30 = [[5, "."], [11, "."], [22, "."], [30, "."]]

[anim.walk]
frames = ["walk_0", "walk_1", "walk_0", "walk_2"]
ms = 140
