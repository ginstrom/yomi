# A hero's body, bare: hair, tunic, trousers, boots, empty hands. What it wears and holds
# is drawn over it, from art/gear/: the fist is at rows 18 to 20, columns 22 to 27, and
# the shield arm hangs at columns 7 to 10.
canvas = "unit"

# The fist the held weapon is gripped in, and turns about when it swings (UnitFigure.swing).
[points]
grip = [25, 19]
chest = [16, 15]

[frames]
idle_0 = """
................................
................................
................................
................................
.............kkkkk..............
............kNnnnnk.............
............kNnnnnnk............
............kNnnsshk............
............kNnsskhk............
............kNSssshsk...........
............kNnSnnnk............
..........kkkkSnnnkkkk..........
.........knttntttTTtTTk.........
........knttnttttTTnTTtk........
.......kntnNnttttTtntTtk........
.......kntnNnttttTtntTtk........
.......kntknnttttttnkntTk.......
.......kntkNNNNNONNNkntTk.......
.......kshknnttttttnkntTkkk.....
........kkknnttttttnkkSssshk....
...........knttttttnk.kkkkk.....
...........kNnnNnnnk............
...........kNnnknnnk............
...........kNnnknnnk............
...........knntknttk............
...........kNnnknnnk............
...........kNnnknnnk............
...........kNnnknnnk............
...........kNnnknnnk............
...........kNNNkNNNnk...........
...........kNNNkNNNNk...........
............kkk.kkkk............
"""

# A stride: the legs part and nothing above them moves, so gear keeps to its idle_0.
# A breath: everything down to the knees sinks a pixel, the grip with it. Gear sinks too (its own idle_1).
[frames.idle_1]
from = "idle_0"
move = { rows = [0, 24], by = [0, 1] }

[frames.walk_0]
from = "idle_0"
[frames.walk_0.rows]
23 = "..........kNnnk.knnnk..........."
24 = "..........knntk.knttk..........."
25 = ".........kNnnk...knnnk.........."
26 = ".........kNnnk...knnnk.........."
27 = "........kNnnk.....knnnk........."
28 = "........kNnnk.....knnnk........."
29 = "........kNNNk.....kNNNnk........"
30 = "........kNNNk.....kNNNNk........"
31 = ".........kkk.......kkkk........."

[anim.idle]
frames = ["idle_0", "idle_1"]
ms = 600

# The near foot lifts and swings: the left, then the right, the shin drawn shorter and
# the foot a pixel behind. Only the leg rows change, so gear keeps to its idle_0.
[frames.walk_1]
from = "idle_0"
[frames.walk_1.rows]
25 = "..........kNnnkknnnk............"
26 = "..........kNnnkknnnk............"
27 = "..........kNNNkknnnk............"
28 = "..........kNNNkknnnk............"
29 = "...........kkk.kNNNnk..........."
30 = "...............kNNNNk..........."
31 = "................kkkk............"

[frames.walk_2]
from = "idle_0"
[frames.walk_2.rows]
25 = "...........kNnnkknnnk..........."
26 = "...........kNnnkknnnk..........."
27 = "...........kNnnkkNNNnk.........."
28 = "...........kNnnkkNNNNk.........."
29 = "...........kNNNk.kkkk..........."
30 = "...........kNNNk................"
31 = "............kkk................."

[anim.walk]
frames = ["walk_0", "walk_1", "walk_0", "walk_2"]
ms = 140
