# A hero's body: horned helm, steel breastplate over a red tabard, empty hands.
# What it holds is drawn over it, from art/gear/: the fist is at rows 18 to 20,
# columns 22 to 27, and the shield arm hangs at columns 7 to 10.
canvas = "unit"

# The fist the held weapon is gripped in, and turns about when it swings (UnitFigure.swing).
[points]
grip = [25, 19]
chest = [16, 15]

[frames]
idle_0 = """
................................
................................
................................
...........k........k...........
..........kWk.kkkk.kWk..........
..........kWWkllwlkWWk..........
...........kTdllwwlTk...........
............kdlllwlk............
............kddsskhk............
............kddssshsk...........
............kddSnnnk............
..........kkkkDnnnkkkk..........
.........kdllddlwwllwwk.........
........kdlllRrrrrrlwwlk........
.......kdldDdRrryrrldllk........
.......kdldddRryyyrldllk........
.......kdlkddRrryrrlkdllk.......
.......kdlkdNnnyynnNkddlk.......
.......kshkddRrrrrrlkddlkkk.....
........kkkddRrrrrrlkkddlllk....
...........kddRrrRdlk.kkkkk.....
...........kDdlRdllk............
...........kDdlkdllk............
...........kDdlkdllk............
...........kdlwklwwk............
