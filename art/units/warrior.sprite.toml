...........kNNnkNNnnk...........
............kkk.kkkk............
"""

# A stride: the legs part and nothing above them moves, so gear keeps to its idle_0.
# A breath: everything down to the knees sinks a pixel, the grip with it. Gear sinks too (its own idle_1).
[frames.idle_1]
from = "idle_0"
move = { rows = [0, 24], by = [0, 1] }

[frames.walk_0]
from = "idle_0"
[frames.walk_0.rows]
23 = "..........kDdlk.kdllk..........."
24 = "..........kdlwk.klwwk..........."
25 = ".........kDdlk...kddlk.........."
26 = ".........kDdlk...kddlk.........."
27 = "........kDdlk.....kddlk........."
28 = "........kDdlk.....kddlk........."
29 = "........kNNnk.....kNnntk........"
30 = "........kNNnk.....kNNnnk........"
31 = ".........kkk.......kkkk........."

[anim.idle]
frames = ["idle_0", "idle_1"]
ms = 600

# The near foot lifts and swings: the left, then the right, the shin drawn shorter and
# the foot a pixel behind. Only the leg rows change, so gear keeps to its idle_0.
[frames.walk_1]
from = "idle_0"
[frames.walk_1.rows]
25 = "..........kDdlkkddlk............"
26 = "..........kDdlkkddlk............"
27 = "..........kNNnkkddlk............"
28 = "..........kNNnkkddlk............"
29 = "...........kkk.kNnntk..........."
30 = "...............kNNnnk..........."
