# A blight lich: a tall gaunt undead sorcerer in a long violet robe with tattered
# gold-trimmed hem, a bone skull under a crown of acid-green spikes with two
# ember eyes, an open ribcage with a sickly green light inside it, one skeletal
# hand hanging and the other gripping a tall wooden staff topped by a violet crystal.
canvas = "unit"

outline = "auto"

[points]
chest = [14, 14]

[frames]
idle_0 = """
................................
......................W...W.....
..........E.E.E.E.....WVzVW.....
..........EeEeEeE.....WVVVW.....
...........WWWWW........WWW.....
.........vBWWWWWW.......t.......
.........vBWkFWkF.......t.......
.........vBWWWkWW.......t.......
.........vB.WwWwW.......t.......
.........vvB.WWW........t.......
........WBvvvvvvvvBW....t.......
........BvvvvDDvvvvB....t.......
.....BvvBvvvWWWWvvvBvvv.t.......
....BvvvBvvvWEEWvvvBvvvvt.......
....BvvVBvvvWEEWvvvBvvV.t.......
...BvvvVBvvvDWWDvvvBvvVWtW......
...BvvvBBvvvvvvvvvvBvB.WWW......
...vBvBvBOyOyOyOyOyBBvv.t.......
....WWW.BvBvvVvvBvvB....t.......
....W.W.BvBvvvvvBvvB....t.......
....W...BvBvvvvvBvvB....t.......
.......BvvBvvVvvBvvvB...t.......
.......BvvBvvvvvBvvvB...t.......
.......BvvBvvvvvBvvvB...t.......
.......BvvBvvvvvBvvvB...t.......
......BvvvBvvVvvBvvvvB..t.......
......BvvvBvvvvvBvvvvB..t.......
......BvvvBvvvvvBvvvvB..t.......
......yOyOyOyOyOyOyOyO..t.......
......BvvvBvvvvvBvvvvB..t.......
......vB..WWW..WWW..Bv.t........
................................
"""

# A breath: head, shoulders, sleeves and staff sink a pixel; the hem stays.
[frames.idle_1]
from = "idle_0"
move = { rows = [0, 17], by = [0, 1] }

[anim.idle]
frames = ["idle_0", "idle_1"]
ms = 750

# A stride: the feet part under the hem.
[frames.walk_0]
from = "idle_0"
[frames.walk_0.rows]
30 = "......vBWWW......WWWBv.t........"

# The left foot lifts, then the right. Only the hem's bottom row changes.
[frames.walk_1]
from = "idle_0"
[frames.walk_1.rows]
30 = "......vB.......WWW..Bv.t........"

[frames.walk_2]
from = "idle_0"
[frames.walk_2.rows]
30 = "......vB..WWW.......Bv.t........"

[anim.walk]
frames = ["walk_0", "walk_1", "walk_0", "walk_2"]
ms = 200
