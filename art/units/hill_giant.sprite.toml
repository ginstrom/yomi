# A stride: both legs part, the left reaching back and the right forward; everything above the hips stays put.
[frames.walk_0]
from = "idle_0"
[frames.walk_0.runs]
26 = [[6, "BccccB...BccccB"]]
27 = [[6, "BccccB...BccccB"]]
28 = [[5, "BccccB.....BccccB"]]
29 = [[4, "bbccccB.....Bcccbb"]]
30 = [[3, "bbbccccB.....Bccccbb"]]

# The feet lift in turn: the left, then the right. Only the leg rows change.
[frames.walk_1]
from = "idle_0"
[frames.walk_1.runs]
29 = [[6, "......."]]
30 = [[5, "........"]]

[frames.walk_2]
