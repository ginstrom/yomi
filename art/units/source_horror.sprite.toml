28 = [[4, "Gggggg"], [18, "Gggggg"]]
29 = [[3, "Gggggggg"], [18, "Ggggggg"]]
30 = [[2, "WgWgWgWg"], [18, "WgWgWgWgW"]]

# The near foot lifts: the left, then the right. Only the leg rows change.
[frames.walk_1]
from = "idle_0"
[frames.walk_1.runs]
28 = [[5, "......"]]
29 = [[4, "........"]]
30 = [[3, "........"]]

[frames.walk_2]
from = "idle_0"
[frames.walk_2.runs]
28 = [[17, "......"]]
29 = [[17, "......."]]
30 = [[17, "........."]]

[anim.walk]
frames = ["walk_0", "walk_1", "walk_0", "walk_2"]
ms = 170
