# The Blight Horror as the Source's last guardian: the near-home horror grown
# grander and fouler, a hulk of rotten olive flesh crowned with a ridge of tall
# bone spikes, two pale eyes under a dark brow, a wide red maw of teeth, a
# glowing blight core cracked open in its chest with acid-green veins running
# from it, and a great clawed hand reaching forward.
canvas = "unit"

outline = "auto"

[points]
chest = [14, 17]

[frames.idle_0.runs]
1 = [[12, "W"], [20, "W"]]
2 = [[12, "W"], [16, "W"], [20, "W"]]
3 = [[12, "W"], [16, "W"], [20, "W"]]
4 = [[8, "W"], [12, "W"], [16, "W"], [20, "W"], [24, "W"]]
