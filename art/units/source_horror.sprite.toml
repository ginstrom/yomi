# A breath: the hulk sinks a pixel over its legs, claw and all.
[frames.idle_1]
from = "idle_0"
move = { rows = [0, 23], by = [0, 1] }

[anim.idle]
frames = ["idle_0", "idle_1"]
ms = 650

# A stride: the legs part and nothing above them moves.
[frames.walk_0]
from = "idle_0"
[frames.walk_0.runs]
24 = [[8, "Gggggg"], [15, "Gggggg"], [22, "Ggggggg"]]
25 = [[7, "Gggggg"], [15, "Gggggg"], [22, "W.W.W.W"]]
26 = [[6, "Gggggg"], [16, "Gggggg"], [22, "W.W.W.W"]]
