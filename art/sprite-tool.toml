# sprite-tool project (https://github.com/ginstrom/sprite-tool). Paths are relative to this file.
# Run `sprite guide` for the sprite file format.
version = 1
palette = "palette.toml"

# One table per canvas class. A sprite's size comes from its class.
[canvas.unit]
size = [32, 32]          # width, height in pixels
anchor = [16, 32]        # exported as the pivot; here bottom centre
display_scale = 3        # how much the game enlarges this class
outline = ["k"]          # edge pixels must use one of these palette keys
grounded = true          # the bottom row of every frame must have a pixel

[canvas.tile]
size = [16, 16]
anchor = [0, 0]
display_scale = 4

[canvas.icon]
size = [20, 20]
anchor = [10, 10]
display_scale = 2
outline = ["k"]

[canvas.map]              # points of interest on the world map
size = [24, 24]
anchor = [12, 12]
display_scale = 2
outline = ["k"]

[canvas.building]         # a facility of the encampment, on the encampment screen
size = [48, 48]
anchor = [24, 48]
display_scale = 3
outline = ["k"]
grounded = true

[canvas.portrait]         # a party member's face, filling the canvas edge to edge
size = [32, 32]
anchor = [16, 16]
display_scale = 2

[canvas.effect]           # a shot, a missile or a burst in battle: drawn pointing right, turned by the game about its centre
size = [16, 16]
anchor = [8, 8]
display_scale = 2        # as a unit is shown in battle (UNIT_SCALE), so the pixels match

[preview]
scale = 6                # default upscale for `sprite preview`
background = "#3a3a3a"

# `sprite build` writes every [[export]] target. `frames` writes one PNG per frame.
[[export]]
type = "frames"
out = "../public/assets/sprites"   # icons and portraits are loaded as assets/sprites/<id>.png

# One sheet of every frame, with the animations: what the units, their gear and the map's sprites are shown from.
[[export]]
type = "phaser"
out = "../public/assets/sprites"
name = "atlas"           # atlas.png, atlas.json, atlas.anims.json; BootScene loads them

