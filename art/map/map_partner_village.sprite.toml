# A trade partner on the world map: Millbrook, a farming village. A windmill
# with turning sails, two thatched cottages and a strip of golden field.
canvas = "map"
outline = "auto"

[frames.base.runs]
# windmill sails (a plus) over the mill
2 = [[5, "W"]]
3 = [[5, "W"]]
4 = [[5, "W"]]
5 = [[5, "W"]]
6 = [[1, "WWWWYWWWW"]]
7 = [[4, "nWn"]]
8 = [[3, "nnWnn"]]
9 = [[3, "TTWtt"]]
10 = [[3, "TTWtt"]]
11 = [[3, "TTTtt"], [12, "yY"]]
12 = [[3, "TTTtt"], [11, "OyYyO"]]
13 = [[3, "TbTtt"], [10, "OyyYyyO"], [19, "yYy"]]
14 = [[3, "TTTtt"], [11, "WWWWW"], [18, "OyYyO"]]
15 = [[3, "TTTtt"], [11, "WbWNW"], [19, "WbW"]]
16 = [[3, "TTNtt"], [11, "WWWNW"], [19, "WNW"]]
17 = [[3, "TTNtt"], [11, "WWWNW"], [19, "WNW"]]
# grass, then the field
18 = [[1, "gggeggggeggggegggegggg"]]
19 = [[1, "yYyYyYyYyYyYyYyYyYyYyY"]]
20 = [[1, "OyOyOyOyOyOyOyOyOyOyOy"]]
21 = [[1, "gggggggggggggggggggggg"]]

# The sails turn a quarter: a cross becomes an X.
[frames.turn]
from = "base"

[frames.turn.runs]
2 = [[5, "."], [1, "W"], [9, "W"]]
3 = [[5, "."], [2, "W"], [8, "W"]]
4 = [[5, "."], [3, "W"], [7, "W"]]
5 = [[5, "."], [4, "W"], [6, "W"]]
6 = [[1, "...."], [5, "Y"], [6, "...."]]
7 = [[4, "W"], [5, "n"], [6, "W"]]
8 = [[3, "W"], [5, "n"], [7, "W"]]
9 = [[2, "W"], [5, "T"], [8, "W"]]
10 = [[1, "W"], [5, "T"], [9, "W"]]

[anim.idle]
frames = ["base", "turn", "base", "turn"]
ms = 500
