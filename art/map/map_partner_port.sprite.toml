# A trade partner on the world map: Saltmere, a fishing port on the south
# coast. A tiled hut and white salt pans on the shore, a jetty into the
# water, and a fishing boat with a pale sail at its mooring.
canvas = "map"
outline = "auto"

[frames.base.runs]
# the shore: hut, salt heap and the two salt pans
3 = [[4, "oo"]]
4 = [[3, "orro"], [16, "W"]]
5 = [[2, "orrrro"], [15, "WWW"]]
6 = [[2, "TTTTTT"], [11, "aaaaaaaaaaaa"]]
7 = [[2, "TbTNTT"], [11, "aWWWWaWWWWWa"]]
8 = [[2, "TTTNTT"], [11, "aWWWWaWWWWWa"]]
9 = [[2, "TTTNTT"], [11, "aaaaaaaaaaaa"]]
10 = [[1, "TTtTTTtTTTtTTTtTTTtTTT"]]
# the water, the jetty (cols 12-14) and the boat
11 = [[1, "bbbbb"], [6, "r"], [7, "bbbbb"], [12, "tTt"], [15, "bbbbbbbb"]]
12 = [[1, "bbbb"], [5, "Wn"], [7, "bbbbb"], [12, "TtT"], [15, "bbbbbbbb"]]
13 = [[1, "bbb"], [4, "WWn"], [7, "bbbbb"], [12, "tTt"], [15, "bbbbbbbb"]]
14 = [[1, "bb"], [3, "WWWn"], [7, "bbbbb"], [12, "TtT"], [15, "bbbbbbbb"]]
15 = [[1, "bb"], [3, "WWWn"], [7, "bbbbb"], [12, "tTt"], [15, "bbbbbbbb"]]
16 = [[1, "b"], [2, "WWWWn"], [7, "bbbbb"], [12, "TtT"], [15, "bbbbbbbb"]]
17 = [[1, "bbbbb"], [6, "n"], [7, "bbbbb"], [12, "NtN"], [15, "bbbbbbbb"]]
18 = [[1, "b"], [2, "nnnnnnnnn"], [11, "bbbbbbbbbbbb"]]
19 = [[1, "bb"], [3, "NNNNNNN"], [10, "bbbbbbbbbbbbb"]]
20 = [[1, "bbbbcbbbbbbbbbbbcbbbbb"]]
21 = [[1, "bbbbbbbbbbbbbbbbbbbbbb"]]

# The water shimmers and the boat dips a pixel.
[frames.swell]
from = "base"

[frames.swell.runs]
17 = [[1, "bbbbb"], [6, "n"], [7, "bbbbb"], [12, "NtN"], [15, "bbbbcbbb"]]
20 = [[1, "bbbbbbcbbbbbbbbbbcbbbb"]]

[anim.idle]
frames = ["base", "swell"]
ms = 600
