# A resource: a heap of gold-flecked ore.
canvas = "map"
outline = "auto"

[frames]
base = """
........................
........................
........................
........................
........................
............m...........
.........aaammmm........
........aaaammmmm.......
........aaYymmmmm.......
........aayOmmmmm.......
.......mmmmmmmmmmm......
.....aaammmmmYymm.......
....aaaammmmmyOmmMMM....
...aaaaammmmmmmmmMMMM...
...aaaYymmmmmmmmYyMMMM..
...mmmyOmmmmmmmmyOMMMM..
...mmmmmmmmMYyMMMMMMMM..
...mmmmmYymMyOMMMMYyMM..
....mmmmyOmmMMMMMMyOM...
.....mmmmmmm.MMMMMMM....
........m.......M.......
........................
........................
........................
"""

# The gold catches the light, one fleck and then another.
[frames.glint_0]
from = "base"
runs = { 8 = [[10, "W"]], 16 = [[12, "W"]] }

[frames.glint_1]
from = "base"
runs = { 11 = [[13, "W"]], 17 = [[18, "W"]] }

[anim.idle]
frames = ["base", "glint_0", "base", "glint_1"]
ms = 450
