# A steel breastplate with pauldrons and arm plates, over a red tabard: the Steel Breastplate.
# Drawn over the hero's body (art/units/warrior.sprite.toml), so it is outlined by hand
# and leaves open what the body shows through: see art/CLAUDE.md. It stops short of the
# fist (rows 17 to 21, columns 20 to 27) and the off hand (rows 17 to 19, columns 7 to 10).
canvas = "unit"
over = "warrior"

[frames.idle_0.runs]
11 = [[10, "kkkkD"], [18, "kkkk"]]
12 = [[9, "kdllddlwwllwwk"]]
13 = [[8, "kdlllRrrrrrlwwlk"]]
14 = [[7, "kdldDdRrryrrldllk"]]
15 = [[7, "kdldddRryyyrldllk"]]
16 = [[7, "kdlkddRrryrrlkdllk"]]
17 = [[11, "dNnnyynnN"]]
18 = [[11, "ddRrrrrrl"]]
19 = [[11, "ddRrrrrrl"]]
20 = [[11, "kddRrrRdl"]]
21 = [[15, "R"]]

# The hero's breath: the body's idle_1 sinks a pixel, and what it wears with it.
[frames.idle_1]
from = "idle_0"
shift = [0, 1]

[anim.idle]
like = "warrior"      # breathes with the body

[anim.walk]
rest = true           # holds idle_0 while the body walks
