[project]
name = "yomi-audio"
version = "0.1.0"
description = "Yomi's host-only audio tool: sound-effect recipes, sources and (later) narration."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
# Text-to-speech engines, added by step 03. Kept out of the base set so that
# `sfx check` never installs torch or mlx.
tts = [
    "mlx-audio==0.6.5",
]

[project.scripts]
yomi-audio = "yomi_audio.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yomi_audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
